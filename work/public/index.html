<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Escala Digital</title>
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">ESC</div>
    <nav>
      <a href="#dashboard" class="active">Dashboard</a>
      <a href="#funcionarios">Funcionarios</a>
      <a href="#escalas">Escalas</a>
    </nav>
  </aside>

  <main class="app-shell">
    <header class="topbar">
      <div>
        <p class="eyebrow">Escala Digital</p>
        <h1>Geracao e consulta de escalas</h1>
      </div>
      <div class="user-area">
        <span id="userName">Carregando...</span>
        <button id="logoutBtn" type="button">Sair</button>
      </div>
    </header>

    <section class="toolbar">
      <label>
        Loja
        <select id="lojaSelect"></select>
      </label>
      <label>
        Mes
        <input id="mesRefInput" type="month">
      </label>
      <button id="loadDataBtn" type="button">Carregar dados</button>
      <button id="saveSampleBtn" type="button">Salvar escala teste</button>
    </section>

    <section class="status-grid">
      <article>
        <span class="metric" id="lojasCount">0</span>
        <strong>Lojas disponiveis</strong>
      </article>
      <article>
        <span class="metric" id="funcionariosCount">0</span>
        <strong>Funcionarios carregados</strong>
      </article>
      <article>
        <span class="metric" id="ausenciasCount">0</span>
        <strong>Ausencias no periodo</strong>
      </article>
      <article>
        <span class="metric" id="escalasCount">0</span>
        <strong>Escalas salvas</strong>
      </article>
    </section>

    <section class="content-section">
      <div class="section-header">
        <h2>Funcionarios</h2>
        <span id="statusMessage"></span>
      </div>
      <div class="table-wrapper">
        <table>
          <thead>
            <tr>
              <th>Chapa</th>
              <th>Nome</th>
              <th>Loja</th>
              <th>Brigadista</th>
              <th>Entrada 1</th>
              <th>Saida 1</th>
            </tr>
          </thead>
          <tbody id="funcionariosTable"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="/js/api.js"></script>
  <script src="/js/escala-rules.js"></script>
  <script src="/js/app.js"></script>
</body>
</html>
