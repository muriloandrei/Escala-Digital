name: CI

on:
  push:
    branches: [main, homologacao]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: work
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: work/package-lock.json
      - run: npm ci
      - run: npm run migrations:check
      - run: npm run check
      - run: npm test
